name: ✨ Feature Request
description: Suggest a new feature or enhancement
title: "[Feature]: "
labels: ["enhancement", "triage"]

body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Please describe what you'd like to see added.

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem would this feature solve?
      placeholder: I'm always frustrated when...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How would you like to see this implemented?
      placeholder: Add a method that...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: What alternative solutions have you considered?
      placeholder: I could also use...
    validations:
      required: false

  - type: textarea
    id: examples
    attributes:
      label: Code Examples
      description: Show how the feature would be used
      render: php
      placeholder: |
        $parser = new BankParser();
        $result = $parser->newMethod();
    validations:
      required: false

  - type: dropdown
    id: bank
    attributes:
      label: Related Bank
      description: Is this related to a specific bank?
      options:
        - TatraBanka
        - ČSOB CZ
        - ČSOB SK
        - VÚB
        - New Bank
        - General / All Banks
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other information about the feature
      placeholder: This would be useful for...
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submission Checklist
      options:
        - label: I have searched existing issues and this is not a duplicate
          required: true
        - label: This feature aligns with the library's purpose (parsing bank emails)
          required: true
