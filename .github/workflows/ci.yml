name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  tests:
    name: PHP ${{ matrix.php }} ${{ matrix.dependency-version }}
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        dependency-version: ['']
        include:
          - php: '8.4'
            dependency-version: '--prefer-lowest'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php }}
        extensions: mbstring, xml
        coverage: xdebug
    
    - name: Validate composer.json
      run: composer validate --strict
    
    - name: Cache Composer packages
      uses: actions/cache@v4
      with:
        path: vendor
        key: ${{ runner.os }}-php-${{ matrix.php }}-${{ matrix.dependency-version }}-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-php-${{ matrix.php }}-${{ matrix.dependency-version }}-
    
    - name: Install dependencies
      run: composer update ${{ matrix.dependency-version }} --prefer-dist --no-progress --no-interaction
    
    - name: Run tests
      run: XDEBUG_MODE=coverage vendor/bin/phpunit --coverage-clover build/logs/clover.xml --coverage-html build/coverage
      
    - name: Upload coverage reports
      uses: actions/upload-artifact@v4
      if: matrix.php == '8.4' && matrix.dependency-version == ''
      with:
        name: coverage-report
        path: build/coverage

  code-style:
    name: Code Style (PER-CS/PSR-12 + PHP 8.4)
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'
        extensions: mbstring, xml
    
    - name: Install dependencies
      run: composer install --prefer-dist --no-progress --no-interaction
    
    - name: Check code style
      run: vendor/bin/php-cs-fixer fix --dry-run --diff --verbose

  static-analysis:
    name: Static Analysis (PHPStan level max)
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'
        extensions: mbstring, xml
    
    - name: Install dependencies
      run: composer install --prefer-dist --no-progress --no-interaction
    
    - name: Run PHPStan
      run: vendor/bin/phpstan analyse

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'
    
    - name: Install dependencies
      run: composer install --prefer-dist --no-progress --no-interaction
    
    - name: Run security audit
      run: composer audit

  mutation-testing:
    name: Mutation Testing (Infection)
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'
        extensions: mbstring, xml
        coverage: xdebug
    
    - name: Install dependencies
      run: composer install --prefer-dist --no-progress --no-interaction
    
    - name: Run Infection
      run: XDEBUG_MODE=coverage vendor/bin/infection --min-msi=89 --min-covered-msi=90 --threads=max --logger-github
      env:
        INFECTION_BADGE_API_KEY: ${{ secrets.INFECTION_BADGE_API_KEY }}
        STRYKER_DASHBOARD_API_KEY: ${{ secrets.STRYKER_DASHBOARD_API_KEY }}
        
  update-coverage-badge:
    name: Update Coverage Badge
    needs: tests
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    permissions:
      contents: write
      
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.ref }}
    
    - name: Download coverage report
      uses: actions/download-artifact@v4
      with:
        name: coverage-report
        path: coverage
        
    - name: Extract coverage percentage
      id: coverage
      run: |
        if [ -f coverage/index.html ]; then
          COVERAGE=$(grep -A3 '<td class="success">Total</td>' coverage/index.html | grep -oP '\d+\.\d+(?=%)' | head -1 || echo "0")
          if [ -z "$COVERAGE" ]; then
            COVERAGE=$(grep '<td class="success small"><div align="right">' coverage/index.html | grep -oP '\d+\.\d+' | head -1 || echo "0")
          fi
          echo "Coverage found: ${COVERAGE}%"
          echo "percentage=${COVERAGE}" >> $GITHUB_OUTPUT
        else
          echo "percentage=0" >> $GITHUB_OUTPUT
        fi
        
    - name: Update coverage badge
      if: success()
      run: |
        COVERAGE=${{ steps.coverage.outputs.percentage }}
        COLOR="red"
        if (( $(echo "$COVERAGE >= 80" | bc -l) )); then
          COLOR="brightgreen"
        elif (( $(echo "$COVERAGE >= 60" | bc -l) )); then
          COLOR="yellow"
        elif (( $(echo "$COVERAGE >= 40" | bc -l) )); then
          COLOR="orange"
        fi
        
        sed -i "s/coverage-[0-9.]*%25-[a-z]*/coverage-${COVERAGE}%25-${COLOR}/g" README.md
        
        if ! git diff --quiet README.md; then
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add README.md
          git commit -m "Update coverage badge to ${COVERAGE}%"
          git push origin ${{ github.ref }}
        fi